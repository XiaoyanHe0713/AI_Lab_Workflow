  entry: triangle-d6
  best_known: 12
  verdict: consistent
  reason: Dunavant (1985) explicitly gives a 12-point rule for the triangle of degree
    6, supporting the best_known=12 and the Dunavant source [dunavant-1985]. Stroud
    states the general lower bound dim P_k for degree 2k, which corresponds to dim
    P_3 for degree 6 and matches the entry's stated lower bound context [stroud-1971].
    Lyness & Jespersen provide constructions and tables of symmetric triangle rules
    up to degree 11 and is a relevant supporting source for triangle rules cited in
    the entry [lyness-jespersen-1975]. The documents do not, however, assert that
    the question of minimality (whether 12 is the minimum possible) is resolved; the
    entry's status 'open' plausibly refers to that minimality question but this is
    not explicitly stated in the cited documents.

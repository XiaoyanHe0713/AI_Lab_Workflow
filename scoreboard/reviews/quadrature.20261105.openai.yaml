- board: quadrature
  section: triangle
  entry: triangle-d5
  best_known: 7
  verdict: inconsistent
  reason: The entry's best_known = 7 and the method 'Radon's 7-point degree-5 rule'
    are supported by Radon, who constructs a 7-point degree-5 rule on the triangle
    and shows no degree-5 rule on the triangle has fewer than 7 nodes [radon-1948].
    However the entry attributes the minimality '7' to Möller's lower bound; the provided
    summary of Möller (1976) gives the improved odd-degree lower bound for centrally
    symmetric regions and specifically cites the square for degree 5, not the triangle.
    Thus minimality for the triangle should be attributed to Radon rather than to
    Möller. Also the entry cites Dunavant (1985) which is not present in the provided
    document list and so cannot be verified here.
  documents:
  - radon-1948
  - moller-1976
  - cools-1997
  - cools-rabinowitz-1993

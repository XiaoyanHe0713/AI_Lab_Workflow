- board: fast_transforms
  section: entries
  entry: opcount-dft-n8
  best_known: 120
  verdict: inconsistent
  reason: 'The entry lists best_known = 120 for n = 8. The provided documents show
    lower operation counts for power-of-two DFTs: Yavne (1968) and Duhamel & Hollmann
    (1984) give the split-radix count 4 N log2 N - 6 N + 8, which for N = 8 equals
    56 real operations. Johnson & Frigo (2007) reports an even lower asymptotic count
    (~(34/9) N log2 N) than radix-2, and Van Loan (1992) documents that a basic radix-2
    implementation costs 5 N log2 N = 120 for N = 8. Thus 120 corresponds to a radix-2
    count but is not the best known according to the cited literature, so the entry''s
    best_known value and ''open'' status are inconsistent with these documents.'
  documents:
  - yavne-1968
  - duhamel-hollmann-1984
  - johnson-frigo-2007
  - van-loan-1992
  - cooley-tukey-1965
  suggested_change: Update best_known to the split-radix count 4*N*log2(N) - 6*N +
    8. For N=8 this equals 56; set status to 'solved' (or at least not 'open') and
    keep the listed sources (Cooley & Tukey; Yavne; Duhamel & Hollmann; Johnson &
    Frigo) as relevant references.

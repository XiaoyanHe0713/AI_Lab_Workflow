  entry: opcount-dft-n64
  best_known: 1920
  verdict: inconsistent
  reason: The entry's best_known value 1920 equals the radix-2 count 5 N log2 N (5*64*6
    = 1920) reported for radix-2 algorithms [van-loan-1992], but the reading-list
    documents contain algorithms with lower documented operation counts for N=64.
    Yavne (1968) and Duhamel & Hollmann (1984) give the split-radix exact count 4
    N log2 N - 6 N + 8 = 1160 for N=64, which is lower than 1920. Johnson & Frigo
    (2007) reports an algorithm with about (34/9) N log2 N flops (≈1451 for N=64)
    and is cited as the fewest-known asymptotic count, but for N=64 the split-radix
    exact formula yields the smallest value in these documents. Therefore the stated
    best_known = 1920 is not supported by the provided documents.

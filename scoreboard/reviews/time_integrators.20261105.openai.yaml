  entry: ssp-s9-p3
  best_known: 6.0
  verdict: consistent
  reason: Ketcheson [ketcheson-2008] presents the SSPRK(n^2,3) family with SSP coefficient
    n^2 - n and construction from Euler steps of size dt/(n^2 - n) plus one convex
    combination. For n = 3 this gives s = 9 and coefficient 9 - 3 = 6, matching the
    entry's best_known = 6.0 and the stated source and method. Ketcheson also shows
    optimality for s = n^2, supporting the 'solved' status.

  entry: ssp-s10-p4
  best_known: 6.0
  verdict: consistent
  reason: The listed best-known coefficient 6 for SSPRK(10,4) matches Ketcheson (2008)
    which presents the ten-stage fourth-order method with coefficient 6 [ketcheson-2008].
    The entry's source attribution to Ketcheson (2008) is supported. The note that
    optimality is established by numerical search (i.e., not a strict proof) is consistent
    with the literature treating such high-stage results as numerically optimal rather
    than analytically proven; global numerical searches and tables of numerically
    optimal coefficients are reported in Ruuth (2006) and the monograph [ruuth-2006,
    gottlieb-ketcheson-shu-2011].

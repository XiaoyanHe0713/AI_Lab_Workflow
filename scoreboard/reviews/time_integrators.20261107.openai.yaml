  entry: ssp-s9-p3
  best_known: 6.0
  verdict: consistent
  reason: Document [ketcheson-2008] states the family SSPRK(n^2,3) has SSP coefficient
    n^2 - n and is built from Euler steps of size dt/(n^2 - n) and one convex combination,
    and it reports that this coefficient is shown optimal for s = n^2. For n = 3 this
    gives a 9-stage method with coefficient 9 - 3 = 6, matching the entry's best_known
    value and method description; the source and 'solved' status are supported by
    the same document.

  entry: opcount-dft-n32
  best_known: 800
  verdict: inconsistent
  reason: For N = 32 the documents in the list give specific flop counts that contradict
    best_known = 800. Yavne [yavne-1968] and Duhamel & Hollmann [duhamel-hollmann-1984]
    state the split-radix count 4 N log2 N - 6 N + 8, which for N=32 equals 456. Johnson
    & Frigo [johnson-frigo-2007] report an asymptotically smaller formula (~(34/9)
    N log2 N), which evaluates to about 604 for N=32. Van Loan [van-loan-1992] lists
    the radix-2 cost 5 N log2 N = 800, which matches the entry's best_known value
    but is not the smallest value given by the cited literature. Therefore the entry's
    best_known = 800 is not the smallest known value according to the provided documents.

  entry: opcount-dft-n8
  best_known: 120
  verdict: inconsistent
  reason: 'The listed best_known value 120 matches the radix-2 flop count (5 N log2
    N) reported by van Loan/Cooley–Tukey, but the provided reading-list documents
    also record lower operation counts for power-of-two lengths: Yavne (1968) and
    Duhamel & Hollmann (1984) give the split-radix count 4 N log2 N - 6 N + 8, which
    for N=8 evaluates to 56 real operations; Johnson & Frigo (2007) gives an even-improved
    asymptotic count but for N=8 its estimate (~90.67) is still greater than 56. Therefore
    120 is not the best known value according to the cited documents, so the entry''s
    best_known and the implication that 120 is the best-known count are inconsistent
    with the documents.'
  documents:
  - cooley-tukey-1965
  - yavne-1968
  - duhamel-hollmann-1984
  - johnson-frigo-2007
  - van-loan-1992
  suggested_change: Replace best_known = 120 with best_known = 56 (since 4 N log2
    N - 6 N + 8 = 56 for N=8, see [yavne-1968], [duhamel-hollmann-1984]). Update the
    source to cite Yavne (1968) and Duhamel & Hollmann (1984) as the sources for the
    56-operation count; optionally mention Johnson & Frigo (2007) as providing improved
    asymptotic counts but not a smaller count for N=8. Leave status 'open' only if
    no proof of optimality is claimed; otherwise change status to reflect whether
    optimality is proven in the literature.

- board: fast_transforms
  section: entries
  entry: opcount-dft-n16
  best_known: 320
  verdict: inconsistent
  reason: The provided documents give formulae for the real-operation counts for power-of-two
    DFTs. Yavne (1968) and Duhamel & Hollmann (1984) state the split-radix/Yavne count
    4 N log2 N - 6 N + 8 real operations; for N=16 this evaluates to 168. The entry's
    best_known value 320 does not match these documented counts. Johnson & Frigo (2007)
    present an improved asymptotic flop count (about (34/9) N log2 N), which evaluates
    to ≈241.78 for N=16 and is still larger than 168, so it does not support a best-known
    value of 320. Therefore the best_known value and the implication that this instance
    is still open are inconsistent with the cited documents.
  documents:
  - yavne-1968
  - duhamel-hollmann-1984
  - johnson-frigo-2007
  - cooley-tukey-1965
  suggested_change: Set best_known to 168 (computed from 4 N log2 N - 6 N + 8 with
    N=16, as given in [yavne-1968] and [duhamel-hollmann-1984]) and change status
    to "solved". Keep the listed sources (Cooley & Tukey; Yavne; Duhamel & Hollmann;
    Johnson & Frigo) but note that for N=16 the split-radix/Yavne count (168) is the
    smallest value implied by the cited documents.

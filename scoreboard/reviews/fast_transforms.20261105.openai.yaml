- board: fast_transforms
  section: entries
  entry: opcount-dft-n8
  best_known: 120
  verdict: inconsistent
  reason: For N = 8 the cited literature gives lower operation counts than 120. Yavne
    (1968) and Duhamel & Hollmann (1984) (the split-radix result) give 4 N log2 N
    - 6 N + 8 real operations, which for N=8 evaluates to 56. Johnson & Frigo (2007)
    gives an improved count around (34/9) N log2 N ≈ 90.7 for N=8. Van Loan (1992)
    documents radix-2 costing 5 N log2 N = 120, but that is a higher count than the
    split-radix and modified split-radix results. Therefore the entry's best_known
    value 120 and its implied sourcing are not consistent with the documents, which
    record lower known counts.
  documents:
  - yavne-1968
  - duhamel-hollmann-1984
  - johnson-frigo-2007
  - van-loan-1992
  - cooley-tukey-1965
  suggested_change: Set best_known to 56 (the count 4 N log2 N - 6 N + 8 evaluated
    at N=8) and mark the entry as solved/closed with sources Yavne (1968) and Duhamel
    & Hollmann (1984); optionally note the Johnson & Frigo (2007) improved (but larger-for-N=8)
    flop estimate (~90.7) and that the radix-2 count 120 (van Loan 1992) is not the
    best-known.

- board: fast_transforms
  section: entries
  entry: opcount-dft-n8
  best_known: 120
  verdict: inconsistent
  reason: The provided sources in the reading list include explicit operation counts
    for power-of-two DFTs that contradict best_known = 120. Yavne (1968) and Duhamel
    & Hollmann (1984) give the split-radix count 4 N log2 N - 6 N + 8 which for N=8
    equals 56 real operations. Johnson & Frigo (2007) gives about (34/9) N log2 N
    ≈ 90.7 for N=8, still less than 120; Cooley & Tukey (1965) gives the general O(N
    log N) result but no larger fixed 120 value. The value 120 matches van Loan's
    radix-2 count 5 N log2 N (5*8*3 = 120) [van-loan-1992], but that algorithm is
    not the best-known in the provided documents because split-radix (56) and the
    modified split-radix (≈91) are explicitly lower.
  documents:
  - yavne-1968
  - duhamel-hollmann-1984
  - johnson-frigo-2007
  - van-loan-1992
  - cooley-tukey-1965
  suggested_change: 'Replace best_known = 120 with best_known = 56 (from Yavne 1968
    / Duhamel & Hollmann 1984: 4 N log2 N - 6 N + 8 gives 56 for N=8). Update status
    to ''solved'' (closed) and include Yavne (1968) and Duhamel & Hollmann (1984)
    as primary sources; optionally note Johnson & Frigo (2007) as an improved asymptotic
    algorithm but not improving the N=8 count.'

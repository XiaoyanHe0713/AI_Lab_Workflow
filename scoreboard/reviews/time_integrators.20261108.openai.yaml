  entry: ssp-s9-p3
  best_known: 6.0
  verdict: consistent
  reason: Document [ketcheson-2008] states that the SSPRK(n^2,3) family has SSP coefficient
    n^2 - n and is shown optimal for s = n^2. For n = 3 this gives 9 - 3 = 6, matching
    the entry's best_known = 6. The source cited in the entry matches [ketcheson-2008],
    and that document asserts optimality for the n^2-stage third-order family, supporting
    the 'solved' status.

# Scoreboard: explicit Runge-Kutta methods by strong-stability-preserving coefficient and by stability region.
# Entry format (proposal, Work package 2): class definition, measure, best known value, source, method dossier,
# date entered, flag solved or open, certifier version, margin that counts as a beat. Entries marked
# `provenance: provisional` were entered from memory of the cited sources and must be checked by the librarian
# before any novelty claim. The certifier `stability_region_ssp` computes the SSP coefficient as the radius of
# absolute monotonicity of the Butcher array (the optimal Shu-Osher representation) and the region extents from
# the stability polynomial.
class: explicit-runge-kutta-ssp-and-stability
measure: SSP coefficient at a stated stage count and order (higher is better); real- or imaginary-axis extent of the stability region (higher is better)
beat_margin: coefficient or extent improved by at least 1% relative at the same stage count and order
certifier: stability_region_ssp
certifier_version: 1.0.0
frozen_at: 2026-11-04

ssp:
  entries:
    - id: ssp-s2-p2
      stages: 2
      order: 2
      best_known: 1.0
      status: solved
      method: "SSPRK(2,2), Heun's method in Shu-Osher form: u1 = u0 + dt F0; u2 = (u0 + u1 + dt F1)/2"
      source: >
        Shu & Osher, "Efficient implementation of essentially non-oscillatory shock-capturing schemes",
        J. Comput. Phys. 77 (1988); optimality among two-stage second-order methods in Gottlieb & Shu,
        "Total variation diminishing Runge-Kutta schemes", Math. Comp. 67 (1998).
      entered: 2026-11-04
    - id: ssp-s3-p3
      stages: 3
      order: 3
      best_known: 1.0
      status: solved
      method: "SSPRK(3,3): u1 = u0 + dt F0; u2 = 3/4 u0 + 1/4 (u1 + dt F1); u3 = 1/3 u0 + 2/3 (u2 + dt F2)"
      source: >
        Shu & Osher (1988); optimality in Gottlieb & Shu (1998), Prop. 3.2 (no three-stage third-order method has
        coefficient above one).
      entered: 2026-11-04
    - id: ssp-s4-p3
      stages: 4
      order: 3
      best_known: 2.0
      status: solved
      method: "SSPRK(4,3): three Euler half-steps and the combination u3 = 2/3 u0 + 1/3 (u2 + dt/2 F2)"
      source: >
        Kraaijevanger, "Contractivity of Runge-Kutta methods", BIT 31 (1991) for the bound; the method and its
        optimality in Spiteri & Ruuth, "A new class of optimal high-order strong-stability-preserving time
        discretization methods", SIAM J. Numer. Anal. 40 (2002).
      provenance: provisional
      entered: 2026-11-04
    - id: ssp-s5-p4
      stages: 5
      order: 4
      best_known: 1.508
      status: open
      method: "SSPRK(5,4) of Spiteri & Ruuth (2002), coefficient 1.508 (optimal to numerical search)"
      source: >
        Spiteri & Ruuth (2002), Table; Ruuth, "Global optimization of explicit strong-stability-preserving Runge-Kutta
        methods", Math. Comp. 75 (2006) confirms 1.508 as the optimum found by global search, not a proof.
      provenance: provisional
      entered: 2026-11-04
    - id: ssp-s9-p3
      stages: 9
      order: 3
      best_known: 6.0
      status: solved
      method: "SSPRK(9,3), the n^2-stage third-order family with n = 3: Euler steps of dt/6 and one convex combination"
      source: >
        Ketcheson, "Highly efficient strong stability-preserving Runge-Kutta methods with low-storage implementations",
        SIAM J. Sci. Comput. 30 (2008): coefficient n^2 - n, shown optimal for s = n^2.
      provenance: provisional
      entered: 2026-11-04
    - id: ssp-s10-p4
      stages: 10
      order: 4
      best_known: 6.0
      status: open
      method: "SSPRK(10,4) of Ketcheson (2008), coefficient 6, low storage"
      source: Ketcheson (2008); optimality by numerical search only.
      provenance: provisional
      entered: 2026-11-04
    - id: ssp-s4-p2
      stages: 4
      order: 2
      best_known: 3.0
      status: solved
      method: "SSPRK(s,2): s-1 Euler steps of dt/(s-1) and u_s = u0/s + (s-1)/s (u_{s-1} + dt/(s-1) F); coefficient s-1"
      source: >
        Kraaijevanger (1991) for the bound s-1 on second-order methods; the family in Gottlieb, Shu & Tadmor,
        "Strong stability-preserving high-order time discretization methods", SIAM Review 43 (2001), and Ketcheson (2008).
      provenance: provisional
      entered: 2026-11-04

region:
  entries:
    - id: stab-real-s2-p2
      stages: 2
      order: 2
      axis: real
      best_known: 2.0
      status: solved
      method: any two-stage second-order explicit method (the stability polynomial 1 + z + z^2/2 is forced when s = p)
      source: Hairer, Norsett & Wanner, Solving Ordinary Differential Equations I (1993), Sec. IV.2
      entered: 2026-11-04
    - id: stab-real-s3-p3
      stages: 3
      order: 3
      axis: real
      best_known: 2.512745327
      status: solved
      method: any three-stage third-order explicit method (polynomial 1 + z + z^2/2 + z^3/6)
      source: Hairer, Norsett & Wanner (1993), Sec. IV.2, Table 2.1
      entered: 2026-11-04
    - id: stab-real-s4-p4
      stages: 4
      order: 4
      axis: real
      best_known: 2.785293563
      status: solved
      method: classical RK4 and the 3/8 rule (polynomial 1 + z + z^2/2 + z^3/6 + z^4/24)
      source: Hairer, Norsett & Wanner (1993), Sec. IV.2, Table 2.1
      entered: 2026-11-04
    - id: stab-imag-s4-p4
      stages: 4
      order: 4
      axis: imag
      best_known: 2.828427125
      status: solved
      method: classical RK4 (2 sqrt 2 on the imaginary axis)
      source: Hairer, Norsett & Wanner (1993), Sec. IV.2
      entered: 2026-11-04

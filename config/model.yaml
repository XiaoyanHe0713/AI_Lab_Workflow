# The frozen base. The notebook colab/serve.ipynb fills `frozen_base.checkpoint_hash` once,
# from the Hugging Face file manifest (sha256 of every weight file at the pinned revision).
# After that it is pinned: the notebook refuses to overwrite a different hash and logs the mismatch.
frozen_base:
  hf_repo: Qwen/Qwen3.6-27B
  revision: null            # commit sha pinned by the notebook on first download
  checkpoint_hash: null     # sha256 over "path:sha256\n" lines of every file at that revision
  dtype: bfloat16
  files: null
  bytes: null
  pinned_at: null
  drive_dir: models/Qwen3.6-27B-bf16   # relative to the lab root on Drive

# The 4-bit development build. Built once on an A100 from the frozen base (user decision 2026-11-04:
# no trusted community 4-bit build exists, so quantize once). `method` is what actually succeeded.
quantized:
  method: null              # awq-w4a16 (llm-compressor) | bitsandbytes-nf4 (in-flight, no build) | null
  drive_dir: models/Qwen3.6-27B-w4a16
  checkpoint_hash: null
  built_from: null          # must equal frozen_base.checkpoint_hash
  built_at: null

# Which precision each Colab GPU tier serves (proposal, "Precision" rule):
# bf16 on H100 and G4; the 4-bit build on A100 and L4. Quantized runs are marked in the ledger's
# precision column and never enter a reported cell.
serving:
  server: vllm                  # vllm | sglang
  served_model_name: qwen3.6-27b
  max_model_len: 32768
  max_num_seqs: 64              # concurrent sequences; the hybrid Gated-DeltaNet layers need one state block each
  architecture: Qwen3_5ForConditionalGeneration   # as vLLM 0.33 identifies the checkpoint (hybrid, with a vision tower)
  lora:
    enabled: true
    max_rank: 64
    adapters: {}                # role name -> adapter directory on Drive; empty means base only
  by_gpu:
    H100: bf16
    G4: bf16
    A100: int4
    L4: int4

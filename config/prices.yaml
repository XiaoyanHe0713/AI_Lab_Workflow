# Price table read by lab/cost.py. Every dollar figure in the ledger comes from here and nowhere else.
# Units-per-hour values are ESTIMATES from the Colab Resources panel as of 2026-11; the serving
# notebook asks you to confirm the rate it displays for the running GPU and records the value used
# and its source in the ledger. Edit this file when Colab changes its rates.
colab:
  dollars_per_unit: 0.09998     # Colab Pro+: $49.99 per month for 500 compute units
  units_per_hour:
    T4: 1.76
    L4: 2.40
    A100: 11.77
    H100: 22.50
    G4: 11.77                   # not yet observed; set from the Resources panel on first G4 session
cpu:
  dollars_per_hour: 0.50        # proposal's CPU box price; Colab CPU time is billed inside the GPU session
api:
  # dollars per million tokens; edit to the provider's current price list
  gpt-5: {input: 1.25, output: 10.00}
  gpt-5-mini: {input: 0.25, output: 2.00}
  gpt-4.1: {input: 2.00, output: 8.00}
  claude-opus-5-5: {input: 4.00, output: 20.00}      # Claude API list prices, 2026-11 (cache reads not modelled)
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
  claude-sonnet-4-5: {input: 3.00, output: 15.00}
  claude-opus-4-1: {input: 15.00, output: 75.00}
